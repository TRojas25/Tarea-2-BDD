version: '3.8'

services:
  mongo1:
    image: mongo:latest
    container_name: mongo1
    command: ["mongod", "--replSet", "my-replica-set", "--port", "30001"]
    ports:
      - "30001:30001"
    networks:
      - mongo-net

  mongo2:
    image: mongo:latest
    container_name: mongo2
    command: ["mongod", "--replSet", "my-replica-set", "--port", "30002"]
    ports:
      - "30002:30002"
    networks:
      - mongo-net

  mongo3:
    image: mongo:latest
    container_name: mongo3
    command: ["mongod", "--replSet", "my-replica-set", "--port", "30003"]
    ports:
      - "30003:30003"
    networks:
      - mongo-net

networks:
  mongo-net:
    driver: bridge